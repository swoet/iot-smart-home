[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "smarthome-sim"
version = "0.1.0"
description = "IoT Smart Home Automation Simulation with FastAPI, WebSocket dashboard, and rules engine"
requires-python = ">=3.10"
authors = [{ name = "Shawn" }]

dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.30",
    "typer>=0.12",
    "rich>=13.7",
    "pyyaml>=6.0",
]

[tool.black]
line-length = 100

[tool.ruff]
line-length = 100
select = ["E", "F", "I", "UP", "B"]
ignore = []

[tool.pytest.ini_options]
testpaths = ["tests"]
