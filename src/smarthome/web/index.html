<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>SmartHome Simulation</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
</head>
<body class="bg-slate-100 text-slate-900">
  <nav class="bg-white border-b border-slate-200 sticky top-0 z-10">
    <div class="max-w-6xl mx-auto px-4 py-3 flex items-center justify-between">
      <div class="flex items-center gap-3">
        <div class="text-xl font-semibold">SmartHome Simulation</div>
        <select id="room-select" class="border rounded px-2 py-1 text-sm"></select>
      </div>
      <div class="flex items-center gap-2">
        <button id="edit-rules" class="px-3 py-1.5 rounded bg-white border text-slate-700 hover:bg-slate-50">Rules</button>
        <div id="version" class="text-sm text-slate-500"></div>
      </div>
    </div>
  </nav>

  <main class="max-w-6xl mx-auto p-4 space-y-6">
    <section class="grid grid-cols-1 md:grid-cols-4 gap-4">
      <div class="bg-white rounded-lg shadow p-4">
        <div class="text-sm text-slate-500 flex justify-between items-center">
          <span>Temperature</span>
          <select id="temp-range" class="text-xs border rounded px-1">
            <option value="15m">15m</option>
            <option value="1h" selected>1h</option>
            <option value="24h">24h</option>
          </select>
        </div>
        <div class="mt-1 text-3xl font-bold"><span id="temp-val">--</span> °C</div>
        <canvas id="temp-chart" class="mt-4"></canvas>
      </div>

      <div class="bg-white rounded-lg shadow p-4">
        <div class="text-sm text-slate-500 flex justify-between items-center">
          <span>Light</span>
          <select id="light-range" class="text-xs border rounded px-1">
            <option value="15m">15m</option>
            <option value="1h" selected>1h</option>
            <option value="24h">24h</option>
          </select>
        </div>
        <div class="mt-1 text-3xl font-bold"><span id="light-val">--</span> %</div>
        <canvas id="light-chart" class="mt-4"></canvas>
      </div>

      <div class="bg-white rounded-lg shadow p-4">
        <div class="text-sm text-slate-500 flex justify-between items-center">
          <span>Motion</span>
          <select id="motion-range" class="text-xs border rounded px-1">
            <option value="15m">15m</option>
            <option value="1h" selected>1h</option>
            <option value="24h">24h</option>
          </select>
        </div>
        <div class="mt-1 text-3xl font-bold"><span id="motion-val">--</span></div>
        <canvas id="motion-chart" class="mt-4"></canvas>
      </div>

      <div class="bg-white rounded-lg shadow p-4" id="humidity-card" style="display:none">
        <div class="text-sm text-slate-500 flex justify-between items-center">
          <span>Humidity</span>
          <select id="humidity-range" class="text-xs border rounded px-1">
            <option value="15m">15m</option>
            <option value="1h" selected>1h</option>
            <option value="24h">24h</option>
          </select>
        </div>
        <div class="mt-1 text-3xl font-bold"><span id="humidity-val">--</span> %</div>
        <canvas id="humidity-chart" class="mt-4"></canvas>
      </div>
    </section>

    <section class="bg-white rounded-lg shadow p-4" id="thermostat-card" style="display:none">
      <div class="text-sm text-slate-500">Thermostat Setpoint</div>
      <div class="mt-2 flex items-center gap-4">
        <input id="thermostat-slider" type="range" min="18" max="30" step="0.5" value="24" class="flex-1" />
        <span id="thermostat-val" class="text-2xl font-semibold">24.0°C</span>
      </div>
    </section>

    <section class="grid grid-cols-1 md:grid-cols-3 gap-4">
      <div class="bg-white rounded-lg shadow p-4 flex items-center justify-between" id="fan-card" style="display:none">
        <div>
          <div class="text-sm text-slate-500">Fan</div>
          <div id="fan-state" class="text-xl font-semibold">OFF</div>
        </div>
        <button id="fan-toggle" class="px-4 py-2 rounded bg-slate-900 text-white hover:bg-slate-700">Toggle</button>
      </div>

      <div class="bg-white rounded-lg shadow p-4 flex items-center justify-between" id="bulb-card">
        <div>
          <div class="text-sm text-slate-500">Lightbulb</div>
          <div id="bulb-state" class="text-xl font-semibold">OFF</div>
        </div>
        <button id="bulb-toggle" class="px-4 py-2 rounded bg-slate-900 text-white hover:bg-slate-700">Toggle</button>
      </div>

      <div class="bg-white rounded-lg shadow p-4 flex items-center justify-between" id="plug-card" style="display:none">
        <div>
          <div class="text-sm text-slate-500">Smart Plug</div>
          <div id="plug-state" class="text-xl font-semibold">OFF</div>
        </div>
        <button id="plug-toggle" class="px-4 py-2 rounded bg-slate-900 text-white hover:bg-slate-700">Toggle</button>
      </div>
    </section>

    <section class="bg-white rounded-lg shadow p-4">
      <div class="text-sm text-slate-500 mb-2">Custom Range</div>
      <div class="flex gap-2 items-center flex-wrap">
        <label class="text-sm">Start</label>
        <input type="datetime-local" id="range-start" class="border rounded px-2 py-1 text-sm" />
        <label class="text-sm">End</label>
        <input type="datetime-local" id="range-end" class="border rounded px-2 py-1 text-sm" />
        <button id="apply-range" class="px-3 py-1.5 rounded bg-slate-900 text-white hover:bg-slate-700 text-sm">Apply</button>
        <button id="clear-range" class="px-3 py-1.5 rounded border text-sm">Clear</button>
      </div>
    </section>

    <section class="bg-white rounded-lg shadow p-4">
      <div class="text-sm text-slate-500 mb-2">Export Sensor Data</div>
      <div class="flex gap-2 flex-wrap">
        <button class="export-btn px-3 py-1.5 rounded border text-sm" data-sensor="temp" data-format="csv">Temp (CSV)</button>
        <button class="export-btn px-3 py-1.5 rounded border text-sm" data-sensor="light" data-format="csv">Light (CSV)</button>
        <button class="export-btn px-3 py-1.5 rounded border text-sm" data-sensor="motion" data-format="csv">Motion (CSV)</button>
        <button class="export-btn px-3 py-1.5 rounded border text-sm" data-sensor="humidity" data-format="csv" style="display:none" id="export-humidity-csv">Humidity (CSV)</button>
        <button class="export-btn px-3 py-1.5 rounded border text-sm" data-sensor="temp" data-format="json">Temp (JSON)</button>
        <button id="export-all-csv" class="px-3 py-1.5 rounded border text-sm">Export ALL (CSV)</button>
      </div>
    </section>
  </main>

  <!-- Rules Modal -->
  <div id="rules-modal" class="fixed inset-0 hidden items-center justify-center bg-black/40">
    <div class="bg-white w-[90vw] max-w-3xl rounded shadow-lg overflow-hidden">
      <div class="px-4 py-3 border-b flex items-center justify-between">
        <div class="font-semibold">Edit Rules (YAML)</div>
        <button id="rules-close" class="text-slate-500">✕</button>
      </div>
      <div class="p-4">
        <textarea id="rules-text" class="w-full h-80 border rounded p-2 font-mono text-sm"></textarea>
      </div>
      <div class="px-4 py-3 border-t flex items-center justify-end gap-2">
        <span id="rules-status" class="text-sm"></span>
        <button id="rules-save" class="px-4 py-2 rounded bg-slate-900 text-white hover:bg-slate-700">Save</button>
      </div>
    </div>
  </div>

  <script>
    const tempEl = document.getElementById('temp-val');
    const lightEl = document.getElementById('light-val');
    const motionEl = document.getElementById('motion-val');
    const fanStateEl = document.getElementById('fan-state');
    const bulbStateEl = document.getElementById('bulb-state');
    const versionEl = document.getElementById('version');
    const roomSelect = document.getElementById('room-select');

    const tempCtx = document.getElementById('temp-chart').getContext('2d');
    const lightCtx = document.getElementById('light-chart').getContext('2d');
    const motionCtx = document.getElementById('motion-chart').getContext('2d');
    const humidityCanvas = document.getElementById('humidity-chart');
    const humidityCtx = humidityCanvas ? humidityCanvas.getContext('2d') : null;

    const tempDatasetsByRoom = {};
    const lightDatasetsByRoom = {};
    const motionDatasetsByRoom = {};
    const humidityDatasetsByRoom = {};

    const tempChart = new Chart(tempCtx, { type: 'line', data: { labels: [], datasets: [] }, options: { animation: false, scales: { x: { display: false } } } });
    const lightChart = new Chart(lightCtx, { type: 'line', data: { labels: [], datasets: [] }, options: { animation: false, scales: { x: { display: false }, y: { min: 0, max: 100 } } } });
    const motionChart = new Chart(motionCtx, { type: 'bar', data: { labels: [], datasets: [] }, options: { animation: false, scales: { x: { display: false }, y: { min: 0, max: 1 } } } });
    const humidityChart = humidityCtx ? new Chart(humidityCtx, { type: 'line', data: { labels: [], datasets: [] }, options: { animation: false, scales: { x: { display: false }, y: { min: 0, max: 100 } } } }) : null;

    let currentRoom = null;

    function ensureDataset(map, chart, room, label) {
      if (!map[room]) {
        map[room] = { label, data: [], borderColor: 'rgb(15, 23, 42)', backgroundColor: 'rgba(15,23,42,0.2)', tension: 0.25 };
        chart.data.datasets.push(map[room]);
      }
    }

    function ensureRoomDataset(room) {
      ensureDataset(tempDatasetsByRoom, tempChart, room, `${room} Temp`);
      ensureDataset(lightDatasetsByRoom, lightChart, room, `${room} Light`);
      ensureDataset(motionDatasetsByRoom, motionChart, room, `${room} Motion`);
      if (humidityChart) ensureDataset(humidityDatasetsByRoom, humidityChart, room, `${room} Humidity`);
    }

    function setOnOff(el, on) {
      el.textContent = on ? 'ON' : 'OFF';
      el.classList.toggle('text-green-600', on);
      el.classList.toggle('text-red-600', !on);
    }

    async function postActuator(room, id, body) {
      const res = await fetch(`/api/rooms/${room}/actuators/${id}`, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body) });
      return await res.json();
    }

    document.getElementById('fan-toggle').addEventListener('click', async () => {
      if (!currentRoom) return;
      const on = fanStateEl.textContent.trim() !== 'ON';
      await postActuator(currentRoom, 'fan', { on });
    });

    document.getElementById('bulb-toggle').addEventListener('click', async () => {
      if (!currentRoom) return;
      const on = bulbStateEl.textContent.trim() !== 'ON';
      await postActuator(currentRoom, 'lightbulb', { on });
    });

    document.getElementById('plug-toggle').addEventListener('click', async () => {
      if (!currentRoom) return;
      const on = document.getElementById('plug-state').textContent.trim() !== 'ON';
      await postActuator(currentRoom, 'plug', { on });
    });

    const thermoSlider = document.getElementById('thermostat-slider');
    thermoSlider.addEventListener('input', () => {
      document.getElementById('thermostat-val').textContent = `${Number(thermoSlider.value).toFixed(1)}°C`;
    });
    thermoSlider.addEventListener('change', async () => {
      if (!currentRoom) return;
      await postActuator(currentRoom, 'thermostat', { setpoint: Number(thermoSlider.value) });
    });

    // Rules modal
    const modal = document.getElementById('rules-modal');
    const rulesText = document.getElementById('rules-text');
    const rulesSave = document.getElementById('rules-save');
    const rulesClose = document.getElementById('rules-close');
    const rulesStatus = document.getElementById('rules-status');

    document.getElementById('edit-rules').addEventListener('click', async () => {
      const res = await fetch('/api/rules');
      rulesText.value = await res.text();
      rulesStatus.textContent = '';
      modal.classList.remove('hidden');
      modal.classList.add('flex');
    });

    rulesClose.addEventListener('click', () => { modal.classList.add('hidden'); modal.classList.remove('flex'); });
    rulesSave.addEventListener('click', async () => {
      const res = await fetch('/api/rules', { method: 'PUT', headers: { 'Content-Type': 'text/plain' }, body: rulesText.value });
      const data = await res.json();
      rulesStatus.textContent = data.ok ? 'Saved' : ('Error: ' + data.error);
    });

    function handleSnapshot(snapshot) {
      versionEl.textContent = `v${snapshot.version}`;
      const rooms = snapshot.rooms || {};
      // Populate room select
      roomSelect.innerHTML = '';
      Object.entries(rooms).forEach(([rid, r]) => {
        const opt = document.createElement('option');
        opt.value = rid; opt.textContent = r.name || rid;
        roomSelect.appendChild(opt);
        ensureRoomDataset(rid);
      });
      if (!currentRoom) {
        currentRoom = Object.keys(rooms)[0] || null;
        if (currentRoom) roomSelect.value = currentRoom;
      }
      updateUIForRoom(currentRoom, rooms[currentRoom] || {});
      // Load history for current room (all charts)
      if (currentRoom) {
        loadHistory(currentRoom, 'temp', document.getElementById('temp-range').value);
        loadHistory(currentRoom, 'light', document.getElementById('light-range').value);
        loadHistory(currentRoom, 'motion', document.getElementById('motion-range').value);
        if (document.getElementById('humidity-card').style.display !== 'none') {
          loadHistory(currentRoom, 'humidity', document.getElementById('humidity-range').value);
        }
      }
    }

    roomSelect.addEventListener('change', () => {
      currentRoom = roomSelect.value;
      fetch('/api/state').then(r => r.json()).then(s => {
        const rooms = s.rooms || {};
        updateUIForRoom(currentRoom, rooms[currentRoom] || {});
        loadHistory(currentRoom, 'temp', document.getElementById('temp-range').value);
        loadHistory(currentRoom, 'light', document.getElementById('light-range').value);
        loadHistory(currentRoom, 'motion', document.getElementById('motion-range').value);
        if (document.getElementById('humidity-card').style.display !== 'none') {
          loadHistory(currentRoom, 'humidity', document.getElementById('humidity-range').value);
        }
      });
    });

    function updateUIForRoom(room, rstate) {
      const sensors = rstate.sensors || {};
      const actuators = rstate.actuators || {};
      document.getElementById('fan-card').style.display = actuators.fan ? '' : 'none';
      document.getElementById('thermostat-card').style.display = actuators.thermostat ? '' : 'none';
      document.getElementById('plug-card').style.display = actuators.plug ? '' : 'none';
      const hasHumidity = !!sensors.humidity;
      document.getElementById('humidity-card').style.display = hasHumidity ? '' : 'none';
      document.getElementById('export-humidity-csv').style.display = hasHumidity ? '' : 'none';

      if (sensors.temp?.reading) updateTemp(room, sensors.temp.reading.value);
      if (sensors.light?.reading) updateLight(sensors.light.reading.value);
      if (sensors.motion?.reading) updateMotion(sensors.motion.reading.value);
      if (sensors.humidity?.reading) updateHumidity(room, sensors.humidity.reading.value);
      if (actuators.fan?.state) setOnOff(fanStateEl, !!actuators.fan.state.on);
      if (actuators.lightbulb?.state) setOnOff(bulbStateEl, !!actuators.lightbulb.state.on);
      if (actuators.plug?.state) setOnOff(document.getElementById('plug-state'), !!actuators.plug.state.on);
      if (actuators.thermostat?.state) {
        const sp = Number(actuators.thermostat.state.setpoint || 24);
        document.getElementById('thermostat-slider').value = sp;
        document.getElementById('thermostat-val').textContent = `${sp.toFixed(1)}°C`;
      }
    }

    async function loadHistory(room, sensorId, window='1h', start=null, end=null) {
      let url = `/api/history?room=${room}&sensor_id=${sensorId}`;
      if (start && end) {
        url += `&start=${start}&end=${end}`;
      } else {
        url += `&window=${window}`;
      }
      const res = await fetch(url);
      const data = await res.json();
      const chartMap = { temp: [tempChart, tempDatasetsByRoom], light: [lightChart, lightDatasetsByRoom], motion: [motionChart, motionDatasetsByRoom], humidity: [humidityChart, humidityDatasetsByRoom] };
      const entry = chartMap[sensorId];
      if (!entry) return;
      const [chart, map] = entry;
      if (!chart) return;
      ensureRoomDataset(room);
      const series = map[room];
      chart.data.labels = [];
      series.data.length = 0;
      data.points.forEach(([ts, v]) => {
        chart.data.labels.push(new Date(ts * 1000).toLocaleTimeString());
        series.data.push(sensorId === 'motion' ? (v ? 1 : 0) : v);
      });
      chart.update();
    }

    function updateTemp(room, v) {
      tempEl.textContent = Number(v).toFixed(2);
      const now = new Date();
      ensureRoomDataset(room);
      const series = tempDatasetsByRoom[room];
      if (tempChart.data.labels.length > 100) {
        tempChart.data.labels.shift();
        tempChart.data.datasets.forEach(d => d.data.shift());
      }
      if (tempChart.data.labels.length === 0 || tempChart.data.labels[tempChart.data.labels.length - 1] !== now.toLocaleTimeString()) {
        tempChart.data.labels.push(now.toLocaleTimeString());
      }
      series.data.push(v);
      tempChart.update();
    }

    function updateLight(v) { lightEl.textContent = Number(v).toFixed(1); }

    function updateMotion(v) {
      motionEl.textContent = v ? 'MOTION' : 'No motion';
      motionEl.classList.toggle('text-green-600', !!v);
      const now = new Date();
      if (motionChart.data.labels.length > 100) { motionChart.data.labels.shift(); motionChart.data.datasets.forEach(d => d.data.shift()); }
      if (motionChart.data.labels.length === 0 || motionChart.data.labels[motionChart.data.labels.length - 1] !== now.toLocaleTimeString()) {
        motionChart.data.labels.push(now.toLocaleTimeString());
      }
      ensureRoomDataset(currentRoom);
      motionDatasetsByRoom[currentRoom].data.push(v ? 1 : 0);
      motionChart.update();
    }

    function updateHumidity(room, v) {
      document.getElementById('humidity-val').textContent = Number(v).toFixed(1);
      if (!humidityChart) return;
      const now = new Date();
      if (humidityChart.data.labels.length > 100) { humidityChart.data.labels.shift(); humidityChart.data.datasets.forEach(d => d.data.shift()); }
      if (humidityChart.data.labels.length === 0 || humidityChart.data.labels[humidityChart.data.labels.length - 1] !== now.toLocaleTimeString()) {
        humidityChart.data.labels.push(now.toLocaleTimeString());
      }
      ensureRoomDataset(room);
      humidityDatasetsByRoom[room].data.push(v);
      humidityChart.update();
    }

    // Range change handlers
    document.getElementById('temp-range').addEventListener('change', (e) => { if (currentRoom) loadHistory(currentRoom, 'temp', e.target.value); });
    document.getElementById('light-range').addEventListener('change', (e) => { if (currentRoom) loadHistory(currentRoom, 'light', e.target.value); });
    document.getElementById('motion-range').addEventListener('change', (e) => { if (currentRoom) loadHistory(currentRoom, 'motion', e.target.value); });
    const humRange = document.getElementById('humidity-range');
    if (humRange) humRange.addEventListener('change', (e) => { if (currentRoom) loadHistory(currentRoom, 'humidity', e.target.value); });

    // Export buttons
    document.querySelectorAll('.export-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        if (!currentRoom) return;
        const sensor = btn.dataset.sensor;
        const format = btn.dataset.format;
        const win = (sensor === 'temp') ? document.getElementById('temp-range').value : (sensor === 'light' ? document.getElementById('light-range').value : (sensor === 'motion' ? document.getElementById('motion-range').value : document.getElementById('humidity-range').value));
        let url = `/api/export?room=${currentRoom}&sensor_id=${sensor}&format=${format}`;
        if (customStart && customEnd) {
          url += `&start=${customStart}&end=${customEnd}`;
        } else {
          url += `&window=${win}`;
        }
        window.open(url, '_blank');
      });
    });

    document.getElementById('export-all-csv').addEventListener('click', () => {
      if (!currentRoom) return;
      let url = `/api/export_all?room=${currentRoom}&format=csv`;
      if (customStart && customEnd) {
        url += `&start=${customStart}&end=${customEnd}`;
      } else {
        url += `&window=${document.getElementById('temp-range').value}`;
      }
      window.open(url, '_blank');
    });

    function handleEvent(evt) {
      if (evt.type === 'reading') {
        if (!currentRoom) return;
        if (evt.room !== currentRoom) return;
        if (evt.device_id === 'temp') updateTemp(evt.room, evt.value);
        if (evt.device_id === 'light') updateLight(evt.value);
        if (evt.device_id === 'motion') updateMotion(!!evt.value);
        if (evt.device_id === 'humidity') updateHumidity(evt.room, evt.value);
      }
      if (evt.type === 'actuator') {
        if (!currentRoom || evt.room !== currentRoom) return;
        if (evt.device_id === 'fan') setOnOff(fanStateEl, !!evt.value);
        if (evt.device_id === 'lightbulb') setOnOff(bulbStateEl, !!evt.value);
        if (evt.device_id === 'plug') setOnOff(document.getElementById('plug-state'), !!evt.value);
        if (evt.device_id === 'thermostat' && evt.metric === 'setpoint') {
          const sp = Number(evt.value);
          document.getElementById('thermostat-slider').value = sp;
          document.getElementById('thermostat-val').textContent = `${sp.toFixed(1)}°C`;
        }
      }
    }

    // Custom range handling
    let customStart = null, customEnd = null;
    const startInput = document.getElementById('range-start');
    const endInput = document.getElementById('range-end');
    document.getElementById('apply-range').addEventListener('click', () => {
      if (!startInput.value || !endInput.value) return;
      const s = Date.parse(startInput.value);
      const e = Date.parse(endInput.value);
      if (isNaN(s) || isNaN(e) || e <= s) return;
      customStart = Math.floor(s / 1000);
      customEnd = Math.floor(e / 1000);
      if (currentRoom) {
        loadAllHistories();
      }
    });
    document.getElementById('clear-range').addEventListener('click', () => {
      customStart = customEnd = null;
      if (currentRoom) {
        loadAllHistories();
      }
    });

    function loadAllHistories() {
      if (!currentRoom) return;
      const hasHum = document.getElementById('humidity-card').style.display !== 'none';
      if (customStart && customEnd) {
        loadHistory(currentRoom, 'temp', null, customStart, customEnd);
        loadHistory(currentRoom, 'light', null, customStart, customEnd);
        loadHistory(currentRoom, 'motion', null, customStart, customEnd);
        if (hasHum) loadHistory(currentRoom, 'humidity', null, customStart, customEnd);
      } else {
        loadHistory(currentRoom, 'temp', document.getElementById('temp-range').value);
        loadHistory(currentRoom, 'light', document.getElementById('light-range').value);
        loadHistory(currentRoom, 'motion', document.getElementById('motion-range').value);
        if (hasHum) loadHistory(currentRoom, 'humidity', document.getElementById('humidity-range').value);
      }
    }

    function connectWS() {
      const proto = location.protocol === 'https:' ? 'wss' : 'ws';
      const ws = new WebSocket(`${proto}://${location.host}/ws`);
      ws.onopen = () => console.log('WS connected');
      ws.onmessage = (m) => {
        const data = JSON.parse(m.data);
        if (data.type === 'snapshot') handleSnapshot(data);
        else handleEvent(data);
      };
      ws.onclose = () => {
        console.log('WS closed, retrying in 2s...');
        setTimeout(connectWS, 2000);
      };
    }

    connectWS();
  </script>
</body>
</html>
